<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-display: 'Syne', sans-serif;
  --font-body: 'Outfit', sans-serif;
  --bg: #050a14;
  --bg-raised: #0a1628;
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.08);
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.25);
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #475569;
  --r: 16px;
  --r-lg: 24px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.dashboard { max-width: 1000px; margin: 0 auto; }
.dash-header { text-align: center; margin-bottom: 32px; }
.dash-header h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.8rem;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text-1), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.dash-header p { color: var(--text-2); font-size: 0.9rem; }
.dash-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}
.dash-btn {
  padding: 8px 18px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 9999px;
  color: var(--text-2);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.dash-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-1); }
.dash-btn.danger:hover { background: rgba(239,68,68,0.2); color: #ef4444; border-color: rgba(239,68,68,0.3); }
.setup-notice {
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.25);
  border-radius: var(--r);
  padding: 20px 24px;
  margin-bottom: 24px;
  font-size: 0.85rem;
  color: #fbbf24;
  line-height: 1.7;
}
.setup-notice strong { color: #fbbf24; }
.setup-notice code {
  background: rgba(0,0,0,0.3);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.8rem;
}
.setup-notice ol { margin: 10px 0 0 20px; }
.setup-notice li { margin-bottom: 6px; }
.source-label {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-3);
  margin-bottom: 20px;
}
.source-label span {
  padding: 3px 10px;
  border-radius: 9999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
}
.source-label .remote { color: #34d399; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.1); }
.source-label .local { color: #fbbf24; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.1); }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
  padding: 20px;
  text-align: center;
}
.stat-value {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2rem;
  color: var(--accent);
  margin-bottom: 4px;
}
.stat-label {
  font-size: 0.8rem;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.section { margin-bottom: 32px; }
.section h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.2rem;
  margin-bottom: 16px;
  color: var(--text-1);
}
.table-wrap {
  overflow-x: auto;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
}
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th {
  text-align: left;
  padding: 12px 16px;
  font-weight: 600;
  color: var(--text-2);
  border-bottom: 1px solid var(--glass-border);
  white-space: nowrap;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
td {
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  color: var(--text-2);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 500;
}
.tag-pageview { background: rgba(59,130,246,0.15); color: #60a5fa; }
.tag-click { background: rgba(16,185,129,0.15); color: #34d399; }
.tag-search { background: rgba(245,158,11,0.15); color: #fbbf24; }
.bar-chart {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
  padding: 20px;
}
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-label {
  width: 120px;
  font-size: 0.8rem;
  color: var(--text-2);
  text-align: right;
  flex-shrink: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-track {
  flex: 1;
  height: 24px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #06b6d4);
  border-radius: 6px;
  transition: width 0.5s ease;
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 0.75rem;
  font-weight: 600;
  color: #fff;
  min-width: fit-content;
}
.empty-msg {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-3);
  font-size: 0.9rem;
}
.loading { text-align: center; padding: 40px; color: var(--text-3); }
@media (max-width: 480px) {
  body { padding: 14px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-value { font-size: 1.5rem; }
  .bar-label { width: 70px; font-size: 0.7rem; }
}
</style>
</head>
<body>
<div class="dashboard">
  <div class="dash-header">
    <h1>Analytics Dashboard</h1>
    <p>Visitor tracking for your portfolio</p>
    <div class="dash-actions">
      <button class="dash-btn" onclick="loadData()">Refresh</button>
      <button class="dash-btn" onclick="exportData()">Export JSON</button>
      <button class="dash-btn danger" onclick="clearData()">Clear All</button>
      <a class="dash-btn" href="/">Back to Site</a>
    </div>
  </div>

  <div id="setupNotice"></div>
  <div id="sourceLabel"></div>
  <div class="stats-grid" id="statsGrid"><div class="loading">Loading...</div></div>

  <div class="section">
    <h2>Top Locations</h2>
    <div class="bar-chart" id="locationsChart"></div>
  </div>

  <div class="section">
    <h2>Devices & Browsers</h2>
    <div class="bar-chart" id="devicesChart"></div>
  </div>

  <div class="section">
    <h2>Top Actions</h2>
    <div class="bar-chart" id="actionsChart"></div>
  </div>

  <div class="section">
    <h2>Search Queries</h2>
    <div class="bar-chart" id="searchesChart"></div>
  </div>

  <div class="section">
    <h2>Recent Events</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Detail</th>
            <th>Location</th>
            <th>Device</th>
            <th>Screen</th>
          </tr>
        </thead>
        <tbody id="eventsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'ae_tracking';
let trackingUrl = '';
let allEvents = [];

async function fetchConfig() {
  try {
    const res = await fetch('data.json');
    const data = await res.json();
    trackingUrl = data.trackingUrl || '';
  } catch {}
}

async function fetchEvents() {
  if (trackingUrl) {
    try {
      const res = await fetch(trackingUrl);
      const data = await res.json();
      if (Array.isArray(data)) return data;
      if (data.events && Array.isArray(data.events)) return data.events;
    } catch {}
  }
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}

async function loadData() {
  await fetchConfig();

  const noticeEl = document.getElementById('setupNotice');
  const sourceEl = document.getElementById('sourceLabel');

  if (!trackingUrl) {
    noticeEl.innerHTML =
      '<div class="setup-notice">' +
        '<strong>Setup Required — Tracking is local only</strong><br>' +
        'Right now, visitor data is stored in each visitor\'s own browser (localStorage). ' +
        'To collect ALL visitors\' data in one place, you need to set up a free Google Apps Script:<br>' +
        '<ol>' +
          '<li>Go to <code>script.google.com</code> and create a new project</li>' +
          '<li>Paste the script from <code>google-apps-script.js</code> (in your project folder)</li>' +
          '<li>Click <strong>Deploy &gt; New deployment &gt; Web app</strong></li>' +
          '<li>Set "Execute as" = <strong>Me</strong>, "Who has access" = <strong>Anyone</strong></li>' +
          '<li>Copy the deployment URL</li>' +
          '<li>Paste it into <code>data.json</code> as the <code>"trackingUrl"</code> value</li>' +
        '</ol>' +
        'Once set up, all visitor events will be saved to your Google Sheet and shown here.' +
      '</div>';
    sourceEl.innerHTML = '<div class="source-label">Source: <span class="local">Local browser only</span></div>';
  } else {
    noticeEl.innerHTML = '';
    sourceEl.innerHTML = '<div class="source-label">Source: <span class="remote">Remote (Google Sheet)</span></div>';
  }

  allEvents = await fetchEvents();
  renderDashboard(allEvents);
}

function renderDashboard(events) {
  if (!events.length) {
    document.getElementById('statsGrid').innerHTML = '<div class="empty-msg" style="grid-column:1/-1">No tracking data yet. Visit your site to start collecting.</div>';
    ['locationsChart', 'devicesChart', 'actionsChart', 'searchesChart'].forEach(id => {
      document.getElementById(id).innerHTML = '<div class="empty-msg">No data yet</div>';
    });
    document.getElementById('eventsBody').innerHTML = '';
    return;
  }

  const pageviews = events.filter(e => e.type === 'pageview');
  const clicks = events.filter(e => e.type === 'click');
  const searches = events.filter(e => e.type === 'search');
  const sessions = new Set(events.map(e => e.session)).size;

  document.getElementById('statsGrid').innerHTML =
    statCard(pageviews.length, 'Page Views') +
    statCard(sessions, 'Unique Sessions') +
    statCard(clicks.length, 'Clicks') +
    statCard(searches.length, 'Searches');

  renderBarChart('locationsChart', countBy(events, e => {
    const d = e.detail || {};
    if (!d.country || d.country === 'Unknown') return null;
    return d.city && d.city !== 'Unknown' ? d.city + ', ' + d.country : d.country;
  }));

  renderBarChart('devicesChart', countBy(events, e => {
    const d = e.detail || {};
    if (!d.device) return null;
    return d.device + ' / ' + (d.browser || 'Unknown');
  }));

  renderBarChart('actionsChart', countBy(clicks, e => {
    const d = e.detail || {};
    return d.element + (d.label ? ' (' + d.label + ')' : '');
  }));

  renderBarChart('searchesChart', countBy(searches, e => (e.detail || {}).query || ''));

  const recent = events.slice(-100).reverse();
  document.getElementById('eventsBody').innerHTML = recent.map(e => {
    const d = e.detail || {};
    const time = new Date(e.timestamp);
    const timeStr = time.toLocaleDateString() + ' ' + time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    let detail = '';
    if (e.type === 'pageview') detail = 'Page loaded';
    else if (e.type === 'click') detail = d.element + (d.label ? ': ' + d.label : '');
    else if (e.type === 'search') detail = 'Searched: ' + (d.query || '');

    const loc = d.city && d.city !== 'Unknown' ? d.city + ', ' + (d.country || '') : (d.country || '-');
    const device = d.device ? d.device + ' / ' + (d.browser || '') : '-';
    const screen = d.screen || '-';

    return '<tr>' +
      '<td>' + timeStr + '</td>' +
      '<td><span class="tag tag-' + e.type + '">' + e.type + '</span></td>' +
      '<td>' + detail + '</td>' +
      '<td>' + loc + '</td>' +
      '<td>' + device + '</td>' +
      '<td>' + screen + '</td>' +
    '</tr>';
  }).join('');
}

function statCard(value, label) {
  return '<div class="stat-card"><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div>';
}

function countBy(arr, fn) {
  const counts = {};
  arr.forEach(item => {
    const key = fn(item);
    if (key) counts[key] = (counts[key] || 0) + 1;
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);
}

function renderBarChart(id, entries) {
  const el = document.getElementById(id);
  if (!entries.length) {
    el.innerHTML = '<div class="empty-msg">No data yet</div>';
    return;
  }
  const max = entries[0][1];
  el.innerHTML = entries.map(([label, count]) => {
    const pct = Math.max((count / max) * 100, 8);
    return '<div class="bar-row"><span class="bar-label" title="' + label + '">' + label + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%">' + count + '</div></div></div>';
  }).join('');
}

function exportData() {
  const blob = new Blob([JSON.stringify(allEvents, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'analytics-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearData() {
  if (confirm('Clear all local tracking data? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    loadData();
  }
}

loadData();
</script>
</body>
</html>
